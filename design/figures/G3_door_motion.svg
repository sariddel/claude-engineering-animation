<text x="1070.4" y="400.5" font-size="12.5" font-family="'Segoe UI', Arial, sans-serif" text-anchor="end" fill="#1d1d1b" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">SLED75 box at the nose stop</text>
<text x="40.0" y="908.0" font-size="12.5" font-family="'Segoe UI', Arial, sans-serif" text-anchor="start" fill="#6f6e69" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Leaf chord 1.90 m, sagitta 0.10 m, radius 4.56 m. Rollers at the bottom edge and 0.06 m below the top edge, 1.84 m apart, on tracks 1.59 m off the centreline.</text>
<text x="40.0" y="928.0" font-size="12.5" font-family="'Segoe UI', Arial, sans-serif" text-anchor="start" fill="#6f6e69" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Parked top 4.19 m above ground: 0.07 m spare to the crown chord a side. Least spare in motion 0.054 m (leaf), 0.061 m (track).</text>
<text x="40.0" y="948.0" font-size="12.5" font-family="'Segoe UI', Arial, sans-serif" text-anchor="start" fill="#6f6e69" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Dashed accent edge: the lowest point the leaf reaches at each station. Anything below it is never touched. The leaf moves only with the bay at vacuum.</text>
<text x="40.0" y="968.0" font-size="12.5" font-family="'Segoe UI', Arial, sans-serif" text-anchor="start" fill="#6f6e69" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">The in-move is 0.11 m so the 0.10 m bulge clears the frame top member as the leaf rises. Ramp tracks are 9 hinged segments a track.</text>
</svg>
