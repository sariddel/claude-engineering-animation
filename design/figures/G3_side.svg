<text x="40.0" y="786.0" font-size="12.5" font-family="'Segoe UI', Arial, sans-serif" text-anchor="start" fill="#6f6e69" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Solid dark lines are the pressure boundary. Accent: leaf, seals, lip and rear port. Dashed accent: parked leaf, and the lowest edge of its swept path; grey line: track centreline. Legs are drawn 3 a side.</text>
<text x="40.0" y="806.0" font-size="12.5" font-family="'Segoe UI', Arial, sans-serif" text-anchor="start" fill="#6f6e69" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">SLED75 outline from CAD values; mast position and loader arm line are drawing aids. Tiller drawn as a box with its rotor.</text>
